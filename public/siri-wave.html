<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Siri Wave - Liquid Glass</title>
  <style>
    /* 加上 relative 为了定位返回按钮 */
    body {
      position: relative;
    }

    /* 悬浮返回按钮，不影响下面特效的布局 */
    .back-btn {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
      z-index: 100;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body style="margin:0;background:#0a0e17;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;">

  <!-- 返回按钮 -->
  <a href="./index.html" class="back-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    返回主页
  </a>

  <!-- 你的原版代码，一动不动 -->
  <script src="https://glass.goose.cc.cd/liquid-glass.js"></script>

  <liquid-glass mode="siri-wave" style="width:640px;height:260px"></liquid-glass>

</body>
</html>
