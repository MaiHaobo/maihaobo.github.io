<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MaiHaobo - 个人主页</title>
    <meta name="description" content="MaiHaobo 的个人主页，iOS 开发者与开源爱好者。" />
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #86868b;
        --line: rgba(0, 0, 0, 0.08);
        --tint: #2f6ae0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --card: #1c1c1e;
          --ink: #f5f5f7;
          --ink-soft: #a1a1a6;
          --line: rgba(255, 255, 255, 0.1);
          --tint: #4c8dff;
        }
      }
      
      * { box-sizing: border-box; }
      
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 640px;
      }

      /* 顶部个人信息区 */
      .profile {
        text-align: center;
        margin-bottom: 40px;
      }
      
      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2f6ae0, #7a3ff2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: #fff;
        font-weight: bold;
        box-shadow: 0 10px 30px rgba(47, 106, 224, 0.3);
        margin-bottom: 16px;
      }

      h1 {
        font-size: 1.8rem;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
      }

      .bio {
        color: var(--ink-soft);
        font-size: 1rem;
        margin-bottom: 16px;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .social-links a {
        color: var(--ink-soft);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s;
      }

      .social-links a:hover {
        color: var(--tint);
      }

      /* 项目卡片区 */
      .section-title {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        margin-bottom: 16px;
        padding-left: 8px;
        font-weight: 600;
      }

      .project-card {
        display: block;
        background: var(--card);
        border-radius: 20px;
        padding: 24px;
        text-decoration: none;
        color: inherit;
        border: 1px solid var(--line);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .project-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }
      
      @media (prefers-color-scheme: dark) {
        .project-card:hover { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
      }

      .project-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .project-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: linear-gradient(135deg, #2f6ae0, #7a3ff2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .project-icon svg { width: 24px; height: 24px; }

      .project-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin: 0;
      }

      .project-desc {
        color: var(--ink-soft);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 16px 0;
      }

      .project-tags {
        display: flex;
        gap: 8px;
      }

      .tag {
        background: var(--bg);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      /* 底部版权 */
      .footer {
        text-align: center;
        margin-top: 50px;
        font-size: 0.8rem;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- 个人信息 -->
      <div class="profile">
        <div class="avatar">M</div>
        <h1>MaiHaobo</h1>
        <p class="bio">iOS 开发者 · 开源爱好者</p>
        <div class="social-links">
          <a href="https://github.com/MaiHaobo" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:3602246802@qq.com">Email</a>
        </div>
      </div>

      <!-- 项目列表 -->
      <div class="projects">
        <div class="section-title">主要项目</div>
        
        <!-- PC on iPhone 项目入口 -->
        <a href="https://maihaobo.github.io/PC-on-iPhone-Website/" class="project-card">
          <div class="project-header">
            <div class="project-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="2.5" width="12" height="19" rx="3" />
                <path d="M10 5h4" />
              </svg>
            </div>
            <h2 class="project-title">PC on iPhone</h2>
          </div>
          <p class="project-desc">
            基于 UTM 优化的 iOS 全功能系统模拟器。让你在 iPhone 和 iPad 上极速运行 Windows、Linux 等桌面系统。
          </p>
          <div class="project-tags">
            <span class="tag">iOS</span>
            <span class="tag">QEMU</span>
            <span class="tag">Swift</span>
          </div>
        </a>
      </div>

      <!-- 版权 -->
      <div class="footer">
        © <span id="year"></span> MaiHaobo. All rights reserved.
      </div>

    </div>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
