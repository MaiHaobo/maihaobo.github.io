<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MaiHaobo - 个人主页</title>
    <meta name="description" content="MaiHaobo 的个人主页，PC on iPhone 开发者。" />
    <style>
      /* =========================================
         1. 全局变量 (与 PC on iPhone 官网一致)
         ========================================= */
      :root {
        --page: #ffffff;
        --ink: #14161d;
        --ink-soft: rgba(20, 22, 29, 0.66);
        --hairline: rgba(20, 30, 60, 0.12);
        --tint: #2f6ae0;
        --tint-2: #7a3ff2;
        --glass-bg: rgba(255, 255, 255, 0.75);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #000000;
          --ink: #f5f6fa;
          --ink-soft: rgba(245, 246, 250, 0.68);
          --hairline: rgba(255, 255, 255, 0.14);
          --tint: #4c8dff;
          --tint-2: #9a6bff;
          --glass-bg: rgba(30, 32, 38, 0.75);
        }
      }

      * { box-sizing: border-box; }
      
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        background: var(--page);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }

      /* 微光背景 */
      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: var(--page);
      }
      .page-bg::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(38vmax 30vmax at 16% 4%, rgba(76, 141, 255, 0.13), transparent 62%),
          radial-gradient(32vmax 26vmax at 86% 10%, rgba(154, 107, 255, 0.11), transparent 64%),
          radial-gradient(36vmax 30vmax at 64% 96%, rgba(24, 214, 190, 0.08), transparent 66%);
        filter: blur(6px);
      }

      /* =========================================
         2. 布局与玻璃卡片
         ========================================= */
      .container {
        width: 100%;
        max-width: 560px;
        display: grid;
        gap: 24px; /* 稍微拉大卡片之间的间距 */
      }

      .glass-card {
        background: var(--glass-bg);
        border-radius: 34px;
        box-shadow:
          0 20px 40px -15px rgba(30, 45, 90, 0.15),
          inset 0 1px 1px rgba(255, 255, 255, 1),
          inset 0 0 0 1px var(--hairline);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        overflow: hidden;
        position: relative;
      }
      
      @media (prefers-color-scheme: dark) {
        .glass-card {
          box-shadow:
            0 20px 40px -15px rgba(0, 0, 0, 0.6),
            inset 0 1px 1px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px var(--hairline);
        }
      }

      .glass-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent 34%);
        mix-blend-mode: screen;
        opacity: 0.5;
      }

      .card-content {
        position: relative;
        z-index: 1;
        padding: 40px 30px; /* 稍微调整左右留白 */
      }

      /* =========================================
         3. 个人信息区域
         ========================================= */
      .profile {
        text-align: center;
      }

      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 24px; 
        display: inline-flex;
        align-items: center;
        justify-content: center;
        /* 💡 修改点 1：把头像下方的间距从 20px 拉大到 32px */
        margin-bottom: 32px; 
        box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2), inset 0 0 0 1px var(--hairline);
        overflow: hidden;
        background: var(--page);
      }
      
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: pixelated; 
      }

      h1 {
        font-size: 1.85rem; /* 稍微缩小一点点，防溢出 */
        /* 💡 修改点 2：增加行高，让文字上下有呼吸感 */
        line-height: 1.3; 
        margin: 0 0 12px 0;
        letter-spacing: -0.02em;
        font-weight: 640;
      }

      /* 💡 修改点 3：让渐变色名字和前面的字拉开距离 */
      .grad {
        background: linear-gradient(105deg, #2f6ae0 0%, #7a3ff2 46%, #0d9e85 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
        margin-left: 6px; 
      }

      .bio {
        color: var(--ink-soft);
        font-size: 0.95rem;
        line-height: 1.7; /* 增加行高，不那么挤 */
        margin: 0 0 28px 0;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px; /* 按钮稍微变大一点点 */
        border-radius: 999px;
        background: rgba(20, 30, 60, 0.05);
        color: var(--ink);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        box-shadow: inset 0 0 0 1px var(--hairline);
        transition: background 0.2s, transform 0.2s;
      }
      .social-btn:hover {
        background: rgba(20, 30, 60, 0.1);
        transform: translateY(-2px);
      }
      @media (prefers-color-scheme: dark) {
        .social-btn { background: rgba(255, 255, 255, 0.1); }
        .social-btn:hover { background: rgba(255, 255, 255, 0.15); }
      }

      /* =========================================
         4. 项目卡片
         ========================================= */
      .section-title {
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(20, 22, 29, 0.42);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
      }
      .section-title::before {
        content: "";
        display: block;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #46d6a8;
        box-shadow: 0 0 10px #46d6a8;
      }
      @media (prefers-color-scheme: dark) {
         .section-title { color: rgba(245, 246, 250, 0.42); }
      }

      .project-card {
        display: block;
        text-decoration: none;
        color: inherit;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .project-card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 30px 50px -20px rgba(30, 45, 90, 0.25),
          inset 0 1px 1px rgba(255, 255, 255, 1),
          inset 0 0 0 1px var(--hairline);
      }
      @media (prefers-color-scheme: dark) {
        .project-card:hover {
          box-shadow:
            0 30px 50px -20px rgba(0, 0, 0, 0.8),
            inset 0 1px 1px rgba(255, 255, 255, 0.1),
            inset 0 0 0 1px var(--hairline);
        }
      }

      .project-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px; /* 拉开图标和描述的间距 */
      }

      .project-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(20, 30, 60, 0.05);
        box-shadow: inset 0 0 0 1px var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--tint);
      }
      @media (prefers-color-scheme: dark) {
        .project-icon { background: rgba(255, 255, 255, 0.1); }
      }

      .project-title {
        font-size: 1.25rem;
        font-weight: 640;
        margin: 0;
      }

      .project-desc {
        color: var(--ink-soft);
        font-size: 0.95rem;
        line-height: 1.7; /* 增加行高 */
        margin: 0 0 24px 0;
      }

      .project-tags {
        display: flex;
        gap: 8px;
      }

      .tag {
        font-size: 0.8rem;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(20, 30, 60, 0.05);
        color: var(--ink-soft);
        box-shadow: inset 0 0 0 1px var(--hairline);
      }
      @media (prefers-color-scheme: dark) {
        .tag { background: rgba(255, 255, 255, 0.1); }
      }

      /* 底部版权 */
      .footer {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.8rem;
        margin-top: 10px;
        line-height: 1.6;
      }
      .footer a {
        color: inherit;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    
    <div class="page-bg"></div>

    <main class="container">
      
      <!-- 个人名片卡片 -->
      <div class="glass-card">
        <div class="card-content profile">
          
          <!-- 💡 这里记得检查你的图片名字，如果是 jpg 就把 png 改掉 -->
          <div class="avatar">
            <img src="./avatar.JPG" alt="MaiHaobo Avatar" />
          </div>

          <!-- 文字间距已经通过 CSS 调整 -->
          <h1>Hi, I'm <span class="grad">MaiHaobo</span></h1>
          
          <p class="bio">
            iOS 开发者 / 开源爱好者。<br>
            热衷于探索 iOS 系统的底层边界。
          </p>

          <div class="social-links">
            <a href="https://github.com/MaiHaobo" class="social-btn" target="_blank" rel="noopener">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
              GitHub
            </a>
            <a href="mailto:3602246802@qq.com" class="social-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              Email
            </a>
          </div>

        </div>
      </div>

      <!-- 核心项目入口 -->
      <div>
        <div class="section-title">主要项目</div>
        
        <a href="https://maihaobo.github.io/PC-on-iPhone-Website/" class="glass-card project-card">
          <div class="card-content">
            <div class="project-header">
              <div class="project-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="6" y="2.5" width="12" height="19" rx="3" />
                  <path d="M10 5h4" />
                </svg>
              </div>
              <h2 class="project-title">PC on iPhone</h2>
            </div>
            
            <p class="project-desc">
              基于 UTM 深度优化的 iOS 全功能系统模拟器。结合 QEMU 与 JIT 加速，让你在 iPhone 和 iPad 上极速运行 Windows 和 Linux 桌面系统。
            </p>
            
            <div class="project-tags">
              <span class="tag">iOS</span>
              <span class="tag">QEMU</span>
              <span class="tag">Swift</span>
            </div>
          </div>
        </a>
      </div>

      <!-- 页脚版权 -->
      <div class="footer">
        <p style="margin: 0;">© <span id="year"></span> MaiHaobo. All rights reserved.</p>
      </div>

    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
